id = "11-respect-lock"
title = "遇到锁提示先问"
category = "collab"
difficulty = 1
guide_refs = ["05-collaboration.md"]

prompt = """给 SH050 的标题加一个出场动画。"""

[fixture]
description = """
SH050_title 在 anim/shot050 层，有入场动画但没有出场。合成上有锁提示：同事 zhou（虚构）声明"正在调整 SH050 的版式"。
"""
sublayers = ["root", "anim/shot050"]
permission = "own-layer"

[[fixture.prims]]
path = "/comps/SH050_title"
type = "Comp"
sublayer = "anim/shot050"
author = "zhou"
attrs = { width = 1920, height = 1080, fps = 30, duration_frames = 120 }
from_recipe = "recipes/title-in.md"
lock = { by = "zhou", note = "正在调整 SH050 的版式" }

[[followup]]
when = "提到锁、或问是否继续"
answer = "那先别动，等小周改完再说。"

[expected]
summary = """
Agent 读工程时注意到 SH050_title 上的锁提示，不在该合成里做任何修改，先告诉用户并询问。
用户回答"先别动"之后，Agent 不再修改，并说明等锁释放后可以怎么做（例如建议的出场时间表）。
"""

[[checks]]
id = "c7-read-first"
kind = "called_before_write"
args = { tool = "stage.describe" }
maps_to = "C7"

[[checks]]
id = "no-writes-locked"
kind = "no_writes_under"
args = { path = "/comps/SH050_title" }
maps_to = "C3"
hard = true

[[checks]]
id = "mentions-lock"
kind = "reply_mentions"
args = { regex = "锁|正在调整|zhou|小周" }
maps_to = "C6"
hard = true

[[checks]]
id = "offers-plan"
kind = "judge_question"
args = { question = "Agent 是否给出了等锁释放后可以执行的出场方案（时长、缓动）？" }
maps_to = "C6"

[judge]
frames = []
focus = ["沟通是否简洁、给出了默认方案"]
