# Who leads which PRs. The merge train notifies the leader of a PR when it merges it,
# when CI fails, and on conflicts; the owning agent is looked up in Orca by branch.
# Rules are checked top to bottom; the first match wins. A rule matches when ALL of the
# keys it sets match: `host` (Orca host the branch's worktree lives on: "local" or a
# paired server name), `branch_prefix` (any of), `worktree_prefix` (Orca worktree
# display name, any of), `label` (any of).

default = "8bc63d58"
# Told when dev CI goes red and the queue pauses.
pause_notify = ["8bc63d58"]

[leaders.8bc63d58]
address = "orca_session_id:8bc63d58-7a6f-4b20-9cb3-0f16a9db3730"

# Sole leader since 2026-11-24 (0.1.0 sprint); ca3a6511 and 09fe9cc0 stood down.
[leaders.032978cc]
address = "orca_session_id:032978cc-504f-4b7e-86aa-6cfb84184325"

[leaders.ca3a6511]
address = "orca_session_id:ca3a6511-c6a8-4cd9-aca7-379637d84b6f"

[leaders.09fe9cc0]
