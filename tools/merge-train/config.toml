# merge-train configuration. Read by merge_train.py on every start; the daemon restarts
# itself when this file changes in the runner worktree.

repo = "FELIXDAD/betterAfterEffect"
base = "dev"

# Orca repo name used to match worktrees in `orca worktree ps` (local and remote hosts).
orca_repo = "betterAfterEffect"
# Paired Orca servers whose worktrees are searched for PR owners and shown on the board.
orca_environments = ["米兰Mac"]
# Handle passed to `orca orchestration send --from` (the daemon runs outside any agent).
orca_from = "merge-train"

# Runner: a separate full clone the daemon runs from and fetches every pass. It must live
# outside ~/Documents: launchd jobs have no access to the Documents folder (macOS privacy
# protection), and a worktree of the main checkout would keep its .git there.
runner_dir = "~/Library/Application Support/bae-merge-train/repo"
# Ref the runner follows; it moves there by itself when the merge train changes.
runner_ref = "origin/dev"
# Scratch worktree (of the runner clone) for Cargo.lock repairs, and its own cargo
# target dir (never shared).
work_dir = "~/Library/Caches/bae-merge-train/work"
cargo_target_dir = "~/Library/Caches/bae-merge-train/target"
state_dir = "~/Library/Application Support/bae-merge-train"

poll_seconds = 60
# A PR whose required checks are still missing or running after this long is failed.
ci_timeout_minutes = 150
# mergeable=UNKNOWN right after another merge is normal; give up only after this long.
unknown_timeout_minutes = 20
# Required checks missing/skipped with nothing queued or running for this long (e.g. a
# head pushed before a CI change): update-branch, or push an empty commit if the PR
# already contains dev, so CI runs again. Once per head.
missing_nudge_minutes = 10
# A required check whose newest run on the head was cancelled (not a test failure) is
# rerun once, after this grace period in case a replacing run is about to start; the
# PR fails only when the same check is cancelled `max_cancellations` times on one head.
cancel_grace_minutes = 2
max_cancellations = 2
# When the PR at the front has waited this long, a later PR (in label order) that is
# fully ready merges first; the front PR keeps its place.
skip_ahead_after_minutes = 30

[labels]
queue = "merge-ready"
paused = "merge-train-paused"        # on the board issue: pauses the queue
blocked = "blocked"
reference_data = "reference-data"    # squash-merged, like branches under ref/

[checks]
# Check-run names (GitHub check_runs[].name, verbatim) that must all be `success` on the
# PR's current head; for each name the newest check run (highest id) counts, and skipped,
# cancelled or missing never pass. Defined by the CI-tier work (branch build/ci-tiers):
# `fast` runs on every PR push; `full` runs on dev/main pushes and on PRs labelled
# merge-ready (labeled/synchronize), so it reruns by itself after update-branch.
fast = ["fast / macOS arm64", "fast / Windows x64"]
full = ["full / macOS arm64", "full / Windows x64"]
# Any other check run that concludes failure/timed_out on the head also blocks the merge.
fail_on_other_failures = true

[merge]
squash_branch_prefixes = ["ref/"]
# PR files that never count as overlapping with newer dev changes.
overlap_ignore_pr = ["Cargo.lock"]
# dev changes (after the PR's merge-base) that never count as overlapping.
overlap_ignore_dev = ["Cargo.lock", "docs/"]

[board]
title = "BAE 进度看板"
