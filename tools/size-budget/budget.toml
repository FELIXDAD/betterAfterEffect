# BAE 体积预算（docs/ARCHITECTURE.md 第 11 节）。
#
# 由 `cargo xtask size`（应用本体）和 `cargo xtask dist`（打包产物）读取，CI 每次都检查。
# 提高预算需要单独的 PR 并写明理由。
#
# 每个表是一项被测产物，字段：
#   description  测量的是什么（报告里显示）
#   max_mib      默认上限，单位 MiB（1 MiB = 1024 × 1024 字节）。第 11 节写的 "MB" 一律按 MiB 计。
#   enforced     true：超出预算时命令以非零退出码失败；false（默认）：只在报告里提示
#   targets      按 target triple 覆盖上限：[<名称>.targets."<triple>"] max_mib = …
#                没有覆盖的 target 用默认 max_mib。

# 应用本体：release 构建的 bae 可执行文件（strip 后）。
# M0 是 15 MiB。M1 起调为 30 MiB：数据模型（loro）、MCP（rmcp + tokio）、界面、音频、渲染、
# 表达式引擎陆续链接进来，冷路径 crate 已经用 opt-level = "s"（根 Cargo.toml）。
# 2026-11-21 临时放宽到 32 MiB（M1 和 0.0.1 期间）：体积清理（#89）、改用系统字体（#149）都已做完，
# 剩下的增长来自真实的新功能（AE 一致性 P0 和效果库接入）。
# 2026-11-23 用户再放宽：Windows 50 MiB（用户原话：“可以进一步放宽，放进 50M 先，但是也不代表
# 你们可以浪费体积”）。macOS 的可执行文件一直约是 Windows 的 0.75 倍（MSVC 的 unwind 表更大；
# 0.0.1：23.31 / 31.07 MiB），按这个比例给 38 MiB，免得 macOS 先卡住；仍在 macOS 应用包 40 MiB 以内。
# 这是上限，不是目标：单个 PR 增加超过 0.3 MiB 要写理由和去掉了哪些浪费；panic = "abort" 和
# cargo bloat 清理仍在队列里。详见 docs/ARCHITECTURE.md 第 11 节、docs/spec/dependencies.md 第 9 节。
# 检查方：cargo xtask size
[app]
description = "bae executable (release, stripped)"
max_mib = 50.0
enforced = true

[app.targets."aarch64-apple-darwin"]
max_mib = 38.0

[app.targets."x86_64-pc-windows-msvc"]
max_mib = 50.0

# 解压后的应用包：macOS 的 BAE.app，Windows 的程序及依赖目录。
# Windows 从 40 调到 52 MiB（2026-11-23）：要装得下 50 MiB 的 bae.exe，另留 2 MiB 给其他文件
# （0.0.1 时只多 0.02 MiB）。macOS 不变。
# 检查方：cargo xtask dist（目前只报告）
[app-bundle]
description = "unpacked application (BAE.app / Windows folder)"
max_mib = 52.0
enforced = false

[app-bundle.targets."aarch64-apple-darwin"]
max_mib = 40.0

[app-bundle.targets."x86_64-pc-windows-msvc"]
max_mib = 52.0

# 压缩后的安装包。目前用 dist 产出的 zip 计量，以后换成 dmg / 安装器。
# 检查方：cargo xtask dist（目前只报告）
[installer]
description = "compressed distributable (zip now, installer later)"
max_mib = 20.0
enforced = false

# bae-hub 服务端二进制（services/bae-hub，工作流 10 落地后接入检查）。
# 检查方：暂无
[bae-hub]
description = "bae-hub server executable (release, stripped)"
max_mib = 15.0
enforced = false
