[package]
name = "bae"
description = "BAE desktop application (assembly only: every feature is an AppModule)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "bae"

[[bin]]
name = "bae"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
bae-agent.workspace = true
bae-app.workspace = true
bae-gpu.workspace = true
bae-model.workspace = true
bae-motion.workspace = true
bae-package.workspace = true
bae-platform.workspace = true
bae-plugin.workspace = true
bae-ui.workspace = true
bae-render = { workspace = true, features = ["media"] }
bae-vector = { workspace = true, features = ["render"] }
bae-ui-motion.workspace = true
bae-text = { workspace = true, features = ["render"] }
egui.workspace = true
egui-wgpu.workspace = true
# accesskit: VoiceOver / Narrator / UI Automation see the labelled widgets (issue #116).
egui-winit = { workspace = true, features = ["accesskit"] }
muda.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
winit.workspace = true

# Native file dialogs (File > Open / Save As, unsaved-changes prompt). Other
# platforms get no dialogs (`shell::dialogs::Headless`).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
rfd.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Acceptance tests drive the real workbench through accesskit (labels, not coordinates).
egui_kittest.workspace = true

[lints]
workspace = true
