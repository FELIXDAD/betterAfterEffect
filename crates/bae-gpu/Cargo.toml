[package]
name = "bae-gpu"
description = "BAE GPU layer: the shared wgpu device (GpuContext), surfaces, capabilities, timers, readback/upload, native handles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Compile the Vulkan backend too (Linux/Android, or as a Windows fallback).
vulkan = ["wgpu/vulkan", "wgpu-hal/vulkan"]

[dependencies]
arc-swap.workspace = true
parking_lot.workspace = true
pollster.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu-hal = { workspace = true, features = ["metal"] }

[target.'cfg(windows)'.dependencies]
wgpu-hal = { workspace = true, features = ["dx12"] }

[target.'cfg(not(any(target_vendor = "apple", windows)))'.dependencies]
wgpu-hal.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
