# Tint (ADBE Tint): docs/spec/ae/_parts/effects--fx-a.md AE-FX-036.
schema_version = 1

[plugin]
id = "bae.effects"
version = "0.1.0"
api = "0.1"
name = "BAE built-in effects"
description = "After Effects compatible built-in effects (workstream 07)."
authors = ["BAE"]
license = "Apache-2.0"

[[effect]]
id = "broadcast-colors"
name = "Broadcast Colors"
category = "Color Correction"
implementation = "wgsl"
ae_match_names = ["ADBE Broadcast Colors"]
flags = ["pixel-independent"]
shader = "shaders/broadcast_colors.wgsl"
includes = ["shaders/signal_limit.wgsl"]

[[effect.param]]
id = 1
key = "broadcast_locale"
name = "Broadcast Locale"
type = "popup"
default = 1
choices = ["NTSC", "PAL"]

[[effect.param]]
id = 2
key = "how_to_make_color_safe"
name = "How to Make Color Safe"
type = "popup"
default = 1
choices = ["Reduce Luminance", "Reduce Saturation", "(-", "Key Out Unsafe", "Key Out Safe"]

[[effect.param]]
id = 3
key = "maximum_signal_amplitude_ire"
name = "Maximum Signal Amplitude (IRE)"
type = "float"
default = 110
range = [90, 120]

[[effect]]
id = "gamma-pedestal-gain"
name = "Gamma/Pedestal/Gain"
category = "Color Correction"
implementation = "wgsl"
ae_match_names = ["ADBE Gamma/Pedestal/Gain2"]
flags = ["pixel-independent"]
shader = "shaders/gamma_pedestal_gain.wgsl"

[[effect.param]]
id = 1
key = "black_stretch"
name = "Black Stretch"
type = "float"
default = 1
range = [1, 4]

[[effect.param]]
id = 2
key = "red_gamma"
name = "Red Gamma"
type = "float"
default = 1
range = [1.5e-05, 32000]

[[effect.param]]
id = 3
key = "red_pedestal"
name = "Red Pedestal"
type = "float"
default = 0
range = [-32000, 32000]

[[effect.param]]
id = 4
key = "red_gain"
name = "Red Gain"
type = "float"
default = 1
range = [-32000, 32000]

[[effect.param]]
id = 5
key = "green_gamma"
name = "Green Gamma"
type = "float"
default = 1
range = [1.5e-05, 32000]

[[effect.param]]
id = 6
key = "green_pedestal"
name = "Green Pedestal"
type = "float"
default = 0
range = [-32000, 32000]

[[effect.param]]
id = 7
key = "green_gain"
name = "Green Gain"
type = "float"
default = 1
range = [-32000, 32000]

[[effect.param]]
id = 8
key = "blue_gamma"
name = "Blue Gamma"
type = "float"
default = 1
range = [1.5e-05, 32000]

[[effect.param]]
id = 9
key = "blue_pedestal"
name = "Blue Pedestal"
type = "float"
default = 0
range = [-32000, 32000]

[[effect.param]]
id = 10
key = "blue_gain"
name = "Blue Gain"
type = "float"
default = 1
range = [-32000, 32000]

[[effect]]
id = "leave-color"
name = "Leave Color"
category = "Color Correction"
implementation = "wgsl"
