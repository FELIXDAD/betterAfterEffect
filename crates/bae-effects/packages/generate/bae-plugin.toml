schema_version = 1

[plugin]
id = "bae.effects"
version = "0.1.0"
api = "0.1"
name = "BAE built-in effects"
description = "After Effects compatible built-in effects (workstream 07)."
authors = ["BAE"]
license = "Apache-2.0"

[[effect]]
id = "fractal"
name = "Fractal"
category = "Generate"
implementation = "wgsl"
ae_match_names = ["ADBE Fractal"]
shader = "shaders/fractal.wgsl"

[[effect.param]]
id = 2
key = "set_choice"
type = "popup"
name = "Set Choice"
default = 1
choices = ["Mandelbrot", "Mandelbrot Inverse", "Mandelbrot over Julia", "Mandelbrot Inverse over Julia", "Julia", "Julia Inverse"]

[[effect.param]]
id = 32
key = "equation"
type = "popup"
name = "Equation"
default = 1
choices = ["z = z^2 + c", "z = z^3 + c", "z = z^5 + c", "z = z^7 + c"]

[[effect.param]]
id = 3
key = "mandelbrot"
type = "group"
name = "Mandelbrot"
end_id = 8

[[effect.param]]
id = 4
key = "mandelbrot_x_real"
type = "float"
name = "X (Real)"
group = "mandelbrot"
default = -0.703
range = [-10000000, 10000000]

[[effect.param]]
id = 5
key = "mandelbrot_y_imaginary"
type = "float"
name = "Y (Imaginary)"
group = "mandelbrot"
default = 0
range = [-10000000, 10000000]

[[effect.param]]
id = 6
key = "mandelbrot_magnification"
type = "float"
name = "Magnification"
group = "mandelbrot"
default = 0
range = [-29, 100]

[[effect.param]]
id = 7
key = "mandelbrot_escape_limit"
type = "int"
name = "Escape Limit"
group = "mandelbrot"
default = 300
range = [1, 1000000]

[[effect.param]]
id = 9
key = "julia"
type = "group"
name = "Julia"
end_id = 14

[[effect.param]]
id = 10
key = "julia_x_real"
type = "float"
name = "X (Real)"
group = "julia"
default = 0
range = [-10000000, 10000000]

[[effect.param]]
id = 11
key = "julia_y_imaginary"
type = "float"
name = "Y (Imaginary)"
group = "julia"
default = 0
range = [-10000000, 10000000]

[[effect.param]]
id = 12
key = "julia_magnification"
type = "float"
name = "Magnification"
group = "julia"
default = 0
range = [-29, 100]

[[effect.param]]
id = 13
key = "julia_escape_limit"
type = "int"
name = "Escape Limit"
group = "julia"
default = 300
range = [1, 1000000]

[[effect.param]]
id = 28
key = "offset_after_inversion"
type = "group"
name = "Offset After Inversion"
end_id = 31

[[effect.param]]
id = 29
key = "offset_after_inversion_x_real"
type = "float"
name = "X (Real)"
group = "offset_after_inversion"
default = 0
range = [-10000000, 10000000]

[[effect.param]]
id = 30
key = "offset_after_inversion_y_imaginary"
type = "float"
name = "Y (Imaginary)"
group = "offset_after_inversion"
default = 0
range = [-10000000, 10000000]

[[effect.param]]
id = 15
key = "color"
type = "group"
name = "Color"
end_id = 23

[[effect.param]]
id = 16
key = "overlay"
type = "checkbox"
name = "Overlay"
group = "color"
default = false

[[effect.param]]
id = 17
key = "transparency"
type = "checkbox"
name = "Transparency"
group = "color"
default = false

[[effect.param]]
id = 18
key = "palette"
type = "popup"
name = "Palette"
group = "color"
default = 1
choices = ["Lightness Gradient", "Hue Wheel", "Black and White", "Solid Color", "Escape Angle", "Grayscale", "Apple ]["]

[[effect.param]]
id = 19
key = "hue"
type = "angle"
name = "Hue"
group = "color"
default = 0

[[effect.param]]
id = 20
key = "cycle_steps"
type = "int"
name = "Cycle Steps"
group = "color"
default = 29
range = [1, 32768]

[[effect.param]]
id = 21
key = "cycle_offset"
type = "angle"
name = "Cycle Offset"
group = "color"
default = 0

[[effect.param]]
id = 22
key = "edge_highlight_force_lq"
type = "checkbox"
name = "Edge Highlight (Force LQ)"
group = "color"
default = false

[[effect.param]]
id = 24
key = "high_quality_settings"
type = "group"
name = "High Quality Settings"
end_id = 27

[[effect.param]]
id = 25
key = "oversample_method"
type = "popup"
name = "Oversample Method"
group = "high_quality_settings"
default = 1
choices = ["Edge Detect - Fast - May Miss Pixels", "Brute Force - Slow - Every Pixel"]

[[effect.param]]
id = 26
key = "oversample_factor"
type = "int"
name = "Oversample Factor"
group = "high_quality_settings"
default = 4
range = [2, 16]

[[effect]]
id = "cc-threads"
name = "CC Threads"
category = "Generate"
implementation = "wgsl"
ae_match_names = ["CS Threads"]
shader = "shaders/cc_threads.wgsl"

[[effect.param]]
id = 1
key = "width"
type = "float"
name = "Width"
default = 50
range = [3, 10000]

[[effect.param]]
id = 2
key = "height"
type = "float"
name = "Height"
default = 50
range = [3, 10000]

[[effect.param]]
id = 3
key = "overlaps"
type = "int"
name = "Overlaps"
default = 3
range = [1, 1000]

[[effect.param]]
id = 4
key = "direction"
type = "angle"
name = "Direction"
default = 0

[[effect.param]]
id = 5
key = "center"
type = "point"
name = "Center"
default = [0.5, 0.5]

[[effect.param]]
id = 6
key = "coverage"
type = "float"
name = "Coverage"
default = 75
range = [0, 100]

[[effect.param]]
id = 7
key = "shadowing"
type = "float"
name = "Shadowing"
default = 50
range = [0, 100]

[[effect.param]]
id = 8
key = "texture"
type = "float"
name = "Texture"
default = 15
range = [0, 100]
