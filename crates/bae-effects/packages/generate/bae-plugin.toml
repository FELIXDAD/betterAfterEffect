schema_version = 1

[plugin]
id = "bae.effects"
version = "0.1.0"
api = "0.1"
name = "BAE built-in effects"
description = "After Effects compatible built-in effects (workstream 07)."
authors = ["BAE"]
license = "Apache-2.0"

[[effect]]
id = "lens-flare"
name = "Lens Flare"
category = "Generate"
implementation = "wgsl"
ae_match_names = ["ADBE Lens Flare"]
shader = "shaders/lens_flare.wgsl"

[[effect.param]]
id = 1
key = "flare_center"
type = "point"
name = "Flare Center"
default = [0.4, 0.4]

[[effect.param]]
id = 2
key = "flare_brightness"
type = "float"
name = "Flare Brightness"
default = 100
range = [0, 300]

[[effect.param]]
id = 4
key = "lens_type"
type = "popup"
name = "Lens Type"
default = 1
choices = ["50-300mm Zoom", "35mm Prime", "105mm Prime"]

[[effect.param]]
id = 3
key = "blend_with_original"
type = "float"
name = "Blend With Original"
default = 0
range = [0, 100]

[[effect]]
id = "beam"
