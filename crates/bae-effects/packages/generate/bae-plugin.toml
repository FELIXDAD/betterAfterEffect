[[effect]]
id = "cc-light-sweep"
name = "CC Light Sweep"
category = "Generate"
implementation = "wgsl"
ae_match_names = ["CC Light Sweep"]
shader = "shaders/cc_light_sweep.wgsl"

[effect.roi]
read = "params.edge_thickness + 2"

[[effect.pass]]
entry = "cc_light_sweep"
reads = ["input"]
writes = "output"

[[effect.param]]
id = 1
key = "center"
type = "point"
name = "Center"
default = [0.5, 0.25]

[[effect.param]]
id = 2
key = "direction"
type = "angle"
name = "Direction"
default = -30

[[effect.param]]
id = 3
key = "shape"
type = "popup"
name = "Shape"
default = 3
choices = ["Linear", "Smooth", "Sharp"]

[[effect.param]]
id = 4
key = "width"
type = "float"
name = "Width"
default = 50
range = [0, 4000]

[[effect.param]]
id = 5
key = "sweep_intensity"
type = "float"
name = "Sweep Intensity"
default = 25
range = [0, 500]

[[effect.param]]
id = 6
key = "edge_intensity"
type = "float"
name = "Edge Intensity"
default = 50
range = [0, 500]

[[effect.param]]
id = 7
key = "edge_thickness"
type = "float"
name = "Edge Thickness"
default = 4
range = [0, 20]

[[effect.param]]
id = 8
key = "light_color"
type = "color"
name = "Light Color"
default = [1, 0.980392, 0.941176, 1]

[[effect.param]]
id = 9
key = "light_reception"
type = "popup"
name = "Light Reception"
default = 1
choices = ["Add", "Composite", "Cutout"]

