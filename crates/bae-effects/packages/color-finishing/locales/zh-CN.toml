[effect.video-limiter]
name = "视频限幅器"
keywords = ["视频限幅"]

[effect.video-limiter.params]
clip_level = "剪辑层级"
compression_before_clipping = "剪切前压缩"
gamut_warning = "色域警告"
gamut_warning_color = "色域警告颜色"

[effect.video-limiter.choices]
clip_level = ["100 IRE（SMPTE 范围）", "103 IRE", "105 IRE（EBU R103 首选）", "109 IRE（SDI 限制）"]
compression_before_clipping = ["无", "3%", "5%", "10%", "20%"]

[effect.cc-toner]
name = "CC Toner"
keywords = ["色调"]

[effect.cc-toner.params]
