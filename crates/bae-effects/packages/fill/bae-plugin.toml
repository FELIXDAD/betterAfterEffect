schema_version = 1

[plugin]
id = "bae.effects"
version = "0.1.0"
api = "0.1"
name = "BAE built-in effects"
description = "After Effects compatible built-in effects (workstream 07)."
authors = ["BAE"]
license = "Apache-2.0"

[[effect]]
id = "fill"
name = "Fill"
category = "Generate"
implementation = "wgsl"
ae_match_names = ["ADBE Fill"]
keywords = ["fill", "color"]
flags = ["pixel-independent"]
shader = "shaders/fill.wgsl"

[[effect.param]]
id = 1
key = "fill_mask"
name = "Fill Mask"
type = "path"
disabled = true

[[effect.param]]
id = 7
key = "all_masks"
name = "All Masks"
type = "checkbox"
default = false
disabled = true

[[effect.param]]
id = 2
key = "color"
name = "Color"
type = "color"
default = [1, 0, 0, 1]

[[effect.param]]
id = 6
key = "invert"
name = "Invert"
type = "checkbox"
default = false

[[effect.param]]
id = 3
key = "horizontal_feather"
name = "Horizontal Feather"
type = "float"
default = 0.0
range = [0, 999]
disabled = true

[[effect.param]]
id = 4
key = "vertical_feather"
name = "Vertical Feather"
type = "float"
default = 0.0
range = [0, 999]
disabled = true

[[effect.param]]
id = 5
key = "opacity"
name = "Opacity"
type = "float"
default = 1.0
range = [0, 1]
