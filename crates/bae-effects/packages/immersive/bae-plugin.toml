reads = ["input"]
writes = "output"

[[effect.param]]
id = 16
key = "auto_vr_properties"
type = "checkbox"
name = "Auto VR Properties"
default = false
flags = ["not-animatable", "cannot-time-vary"]

[[effect.param]]
id = 14
key = "frame_layout"
type = "popup"
name = "Frame Layout"
default = 1
choices = ["Monoscopic", "Stereoscopic - Over/Under", "Stereoscopic - Side by Side"]
flags = ["not-animatable", "cannot-time-vary"]

[[effect.param]]
id = 17
key = "horizontal_field_of_view"
type = "float"
name = "Horizontal Field of View"
default = 360
range = [60, 360]

[[effect.param]]
id = 18
key = "vertical_field_of_view"
type = "float"
name = "Vertical Field of View"
default = 180
range = [60, 180]

[[effect.param]]
id = 2
key = "scale_degrees"
type = "float"
name = "Scale (Degrees)"
default = 60
range = [0, 180]

[[effect.param]]
id = 3
key = "stereo_disparity_degrees"
type = "float"
name = "Stereo Disparity (Degrees)"
default = 0
range = [0, 45]

[[effect.param]]
id = 15
key = "feather"
type = "float"
name = "Feather"
default = 10
range = [0, 100]

[[effect.param]]
id = 4
key = "rotate_source"
type = "group"
name = "Rotate Source"
end_id = 8

[[effect.param]]
id = 5
key = "source_tilt_x_axis"
type = "angle"
name = "Source Tilt (X Axis)"
group = "rotate_source"
default = 0

[[effect.param]]
id = 6
key = "source_pan_y_axis"
type = "angle"
name = "Source Pan (Y Axis)"
group = "rotate_source"
default = 0

[[effect.param]]
id = 7
key = "source_roll_z_axis"
type = "angle"
name = "Source Roll (Z Axis)"
group = "rotate_source"
default = 0

[[effect.param]]
id = 9
key = "rotate_projection"
type = "group"
name = "Rotate Projection"
end_id = 13

[[effect.param]]
id = 10
key = "projection_tilt_x_axis"
type = "angle"
name = "Projection Tilt (X Axis)"
group = "rotate_projection"
default = 0

[[effect.param]]
id = 11
key = "projection_pan_y_axis"
type = "angle"
name = "Projection Pan (Y Axis)"
group = "rotate_projection"
default = 0

[[effect.param]]
id = 12
key = "projection_roll_z_axis"
type = "angle"
name = "Projection Roll (Z Axis)"
group = "rotate_projection"
default = 0

[[effect]]
id = "vr-rotate-sphere"
name = "VR Rotate Sphere"
category = "Immersive Video"
implementation = "wgsl"
ae_match_names = ["Mettle SkyBox Rotate Sphere"]
shader = "shaders/vr_rotate_sphere.wgsl"
includes = ["shaders/sphere.wgsl", "shaders/stereo.wgsl"]
identity_when = "params.tilt_x_axis == 0 && params.pan_y_axis == 0 && params.roll_z_axis == 0"

[effect.roi]
whole_input = true

[[effect.pass]]
entry = "vr_rotate_sphere"
reads = ["input"]
writes = "output"

[[effect.param]]
id = 7
key = "auto_vr_properties"
type = "checkbox"
name = "Auto VR Properties"
default = false
flags = ["not-animatable", "cannot-time-vary"]

[[effect.param]]
id = 6
key = "frame_layout"
type = "popup"
name = "Frame Layout"
default = 1
choices = ["Monoscopic", "Stereoscopic - Over/Under", "Stereoscopic - Side by Side"]
flags = ["not-animatable", "cannot-time-vary"]

[[effect.param]]
id = 8
key = "horizontal_field_of_view"
type = "float"
name = "Horizontal Field of View"
default = 360
range = [60, 360]

[[effect.param]]
id = 9
key = "vertical_field_of_view"
type = "float"
name = "Vertical Field of View"
default = 180
range = [60, 180]

[[effect.param]]
id = 2
key = "tilt_x_axis"
type = "angle"
name = "Tilt (X Axis)"
default = 0

[[effect.param]]
id = 3
key = "pan_y_axis"
type = "angle"
name = "Pan (Y Axis)"
default = 0

[[effect.param]]
id = 4
key = "roll_z_axis"
type = "angle"
name = "Roll (Z Axis)"
default = 0

[[effect.param]]
id = 5
key = "invert_rotation"
type = "checkbox"
name = "Invert Rotation"
default = false

[[effect]]
id = "vr-sphere-to-plane"
name = "VR Sphere to Plane"
category = "Immersive Video"
implementation = "wgsl"
ae_match_names = ["Mettle SkyBox Viewer"]
shader = "shaders/vr_sphere_to_plane.wgsl"
includes = ["shaders/sphere.wgsl", "shaders/projection.wgsl"]

[effect.roi]
whole_input = true
size = ["params.output_frame_width", "params.output_frame_width * ((params.output_frame_aspect_ratio == 1) + (params.output_frame_aspect_ratio == 2) * 0.75 + (params.output_frame_aspect_ratio == 3) * 9 / 16 + (params.output_frame_aspect_ratio == 4) * 10 / 16 + (params.output_frame_aspect_ratio == 5) / frame.input_aspect)"]

[[effect.pass]]
entry = "vr_sphere_to_plane"
reads = ["input"]
writes = "output"

[[effect.param]]
id = 2
key = "input_format"
type = "popup"
name = "Input Format"
default = 3
choices = ["Cube-map", "Sphere-map", "Equirectangular"]

[[effect.param]]
id = 3
key = "output_frame_width"
type = "int"
name = "Output Frame Width"
default = 640
range = [256, 16384]

[[effect.param]]
id = 4
key = "output_frame_aspect_ratio"
type = "popup"
name = "Output Frame Aspect Ratio"
default = 5
choices = ["1:1", "4:3", "16:9", "16:10", "Unchanged"]

[[effect.param]]
id = 5
key = "rotate_projection"
type = "group"
name = "Rotate Projection"
end_id = 9

[[effect.param]]
id = 6
key = "projection_tilt_x_axis"
type = "angle"
name = "Projection Tilt (X Axis)"
group = "rotate_projection"
default = 0

[[effect.param]]
id = 7
key = "projection_pan_y_axis"
type = "angle"
name = "Projection Pan (Y Axis)"
group = "rotate_projection"
default = 0

[[effect.param]]
id = 8
key = "projection_roll_z_axis"
type = "angle"
name = "Projection Roll (Z Axis)"
group = "rotate_projection"
default = 0

[[effect.param]]
id = 10
key = "invert_rotation"
type = "checkbox"
name = "Invert Rotation"
group = "rotate_projection"
default = false

