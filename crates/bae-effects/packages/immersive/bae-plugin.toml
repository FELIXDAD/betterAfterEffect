schema_version = 1

[plugin]
id = "bae.effects"
version = "0.1.0"
api = "0.1"
name = "BAE built-in effects"
description = "After Effects compatible built-in effects (workstream 07)."
authors = ["BAE"]
license = "Apache-2.0"

[[effect]]
id = "vr-converter"
name = "VR Converter"
category = "Immersive Video"
implementation = "wgsl"
ae_match_names = ["Mettle SkyBox Converter"]
shader = "shaders/vr_converter.wgsl"
includes = ["shaders/sphere.wgsl", "shaders/projection.wgsl"]

[effect.roi]
whole_input = true
size = ["params.output_frame_width", "params.output_frame_width * ((params.output == 1) * 0.75 + (params.output == 2 || params.output == 4) + (params.output == 3) * 0.5 + (params.output == 5 || params.output == 6) * 2 / 3 + (params.output == 7) / 6 + (params.output == 8) * 9 / 16)"]

[[effect.pass]]
entry = "vr_converter"
reads = ["input"]
writes = "output"

[[effect.param]]
id = 2
key = "input"
type = "popup"
name = "Input"
default = 1
choices = ["2D Source", "Cube-map 4:3", "Sphere-map", "Equirectangular 2:1", "Fisheye (FullDome)", "Cube-map Facebook 3:2", "Cube-map Pano2VR 3:2", "Cube-map GearVR 6:1", "Equirectangular 16:9"]

[[effect.param]]
id = 3
key = "output"
type = "popup"
name = "Output"
default = 3
choices = ["Cube-map 4:3", "Sphere-map", "Equirectangular 2:1", "Fisheye (FullDome)", "Cube-map Facebook 3:2", "Cube-map Pano2VR 3:2", "Cube-map GearVR 6:1", "Equirectangular 16:9"]

[[effect.param]]
id = 4
key = "output_frame_width"
type = "int"
name = "Output Frame Width"
default = 640
range = [256, 16384]

[[effect.param]]
id = 10
key = "field_of_view"
type = "angle"
name = "Field of View"
default = 180

[[effect.param]]
id = 5
key = "re_orient_camera_view"
type = "group"
name = "Re-orient Camera View"
end_id = 9

[[effect.param]]
id = 6
key = "tilt_x_axis"
type = "angle"
name = "Tilt (X Axis)"
group = "re_orient_camera_view"
default = 0

[[effect.param]]
id = 7
key = "pan_y_axis"
type = "angle"
name = "Pan (Y Axis)"
group = "re_orient_camera_view"
default = 0

[[effect.param]]
id = 8
key = "roll_z_axis"
type = "angle"
name = "Roll (Z Axis)"
group = "re_orient_camera_view"
default = 0

[[effect.param]]
id = 11
key = "invert_rotation"
type = "checkbox"
name = "Invert Rotation"
group = "re_orient_camera_view"
default = false

[[effect]]
id = "vr-plane-to-sphere"
name = "VR Plane to Sphere"
category = "Immersive Video"
implementation = "wgsl"
ae_match_names = ["Mettle SkyBox Project 2D"]
shader = "shaders/vr_plane_to_sphere.wgsl"
includes = ["shaders/sphere.wgsl", "shaders/stereo.wgsl"]

[effect.roi]
whole_input = true

[[effect.pass]]
