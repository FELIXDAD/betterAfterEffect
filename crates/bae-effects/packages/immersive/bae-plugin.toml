schema_version = 1

[plugin]
id = "bae.effects"
version = "0.1.0"
api = "0.1"
name = "BAE built-in effects"
description = "After Effects compatible built-in effects (workstream 07)."
authors = ["BAE"]
license = "Apache-2.0"

[[effect]]
id = "vr-chromatic-aberration"
name = "VR Chromatic Aberration"
category = "Immersive Video"
implementation = "wgsl"
ae_match_names = ["Mettle SkyBox Chromatic Aberrat"]
shader = "shaders/vr_chromatic_aberration.wgsl"
includes = ["shaders/sphere.wgsl", "shaders/stereo.wgsl"]
identity_when = "params.aberration_red == 0 && params.aberration_green == 0 && params.aberration_blue == 0"

[effect.roi]
whole_input = true

[[effect.pass]]
entry = "vr_chromatic_aberration"
reads = ["input"]
writes = "output"

[[effect.param]]
id = 9
key = "auto_vr_properties"
type = "checkbox"
name = "Auto VR Properties"
default = false
flags = ["not-animatable", "cannot-time-vary"]

[[effect.param]]
id = 2
key = "frame_layout"
type = "popup"
name = "Frame Layout"
default = 1
choices = ["Monoscopic", "Stereoscopic - Over/Under", "Stereoscopic - Side by Side"]
flags = ["not-animatable", "cannot-time-vary"]

[[effect.param]]
id = 10
key = "horizontal_field_of_view"
type = "float"
name = "Horizontal Field of View"
default = 360
range = [60, 360]

[[effect.param]]
id = 11
key = "vertical_field_of_view"
type = "float"
name = "Vertical Field of View"
default = 180
range = [60, 180]

[[effect.param]]
id = 3
key = "point_of_interest"
type = "point"
name = "Point of Interest"
default = [0.5, 0.5]

[[effect.param]]
id = 4
key = "aberration_red"
type = "float"
name = "Aberration Red"
default = -10
range = [-100, 100]

[[effect.param]]
id = 5
