schema_version = 1

[plugin]
id = "bae.effects"
version = "0.1.0"
api = "0.1"
name = "BAE built-in effects"
description = "After Effects compatible built-in effects (workstream 07)."
authors = ["BAE"]
license = "Apache-2.0"

[[effect]]
id = "scatter"
name = "Scatter"
category = "Stylize"
implementation = "wgsl"
ae_match_names = ["ADBE Scatter"]
shader = "shaders/scatter.wgsl"

[effect.roi]
read = "params.scatter_amount"

[[effect.pass]]
entry = "scatter"
reads = ["input"]
writes = "output"

[[effect.param]]
id = 1
key = "scatter_amount"
type = "float"
name = "Scatter Amount"
default = 0
range = [0, 1000]

[[effect.param]]
id = 2
key = "grain"
type = "popup"
name = "Grain"
default = 1
choices = ["Both", "Horizontal", "Vertical"]

[[effect.param]]
id = 3
key = "scatter_randomness"
type = "float"
name = "Scatter Randomness"
default = 0
range = [0, 1]

[[effect]]
id = "brush-strokes"
name = "Brush Strokes"
category = "Stylize"
implementation = "wgsl"
ae_match_names = ["ADBE Brush Strokes"]
shader = "shaders/brush_strokes.wgsl"

[effect.roi]
read = "params.stroke_length + params.brush_size"

[[effect.pass]]
entry = "brush_strokes"
reads = ["input"]
writes = "output"

[[effect.param]]
id = 1
key = "stroke_angle"
type = "angle"
name = "Stroke Angle"
default = 135

[[effect.param]]
id = 2
key = "brush_size"
type = "float"
name = "Brush Size"
default = 2
range = [0, 5]

[[effect.param]]
id = 3
key = "stroke_length"
type = "float"
name = "Stroke Length"
default = 5
range = [0, 40]

[[effect.param]]
id = 4
key = "stroke_density"
type = "float"
name = "Stroke Density"
default = 1
range = [0, 2]

[[effect.param]]
id = 5
key = "stroke_randomness"
type = "float"
name = "Stroke Randomness"
default = 1
range = [0, 2]

[[effect.param]]
id = 6
key = "paint_surface"
type = "popup"
name = "Paint Surface"
default = 1
choices = ["Paint on Original Image", "Paint on Transparent", "Paint on White", "Paint on Black"]

[[effect.param]]
id = 7
key = "blend_with_original"
type = "float"
name = "Blend With Original"
default = 0
range = [0, 1]
