schema_version = 1

[plugin]
id = "bae.effects"
version = "0.1.0"
api = "0.1"
name = "BAE built-in effects"
description = "After Effects compatible built-in effects (workstream 07)."
authors = ["BAE"]
license = "Apache-2.0"

[[effect]]
id = "venetian-blinds"
name = "Venetian Blinds"
category = "Transition"
implementation = "wgsl"
ae_match_names = ["ADBE Venetian Blinds"]
keywords = ["venetian", "blinds"]
shader = "shaders/venetian_blinds.wgsl"
identity_when = "params.transition_completion == 0"

[[effect.param]]
id = 1
key = "transition_completion"
type = "float"
name = "Transition Completion"
default = 0
range = [0, 100]

[[effect.param]]
id = 2
key = "direction"
type = "angle"
name = "Direction"
default = 0

[[effect.param]]
id = 3
key = "width"
type = "float"
name = "Width"
default = 20
range = [1, 32000]

[[effect.param]]
id = 4
key = "feather"
type = "float"
name = "Feather"
default = 0
range = [0, 32000]
