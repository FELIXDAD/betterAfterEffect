schema_version = 1

[plugin]
id = "bae.effects"
version = "0.1.0"
api = "0.1"
name = "BAE built-in effects"
description = "After Effects compatible built-in effects (workstream 07)."
authors = ["BAE"]
license = "Apache-2.0"

[[effect]]
id = "color-difference-key"
name = "Color Difference Key"
category = "Keying"
implementation = "wgsl"
ae_match_names = ["ADBE Color Difference Key"]
shader = "shaders/color_difference_key.wgsl"

[[effect.pass]]
entry = "color_difference_key"
reads = ["input"]
writes = "output"

# The four-up preview samples the full layer at half resolution.
[effect.roi]
read = "(params.view == 10) * 32768 / frame.downsample_x"

[[effect.param]]
id = 1
key = "preview"
type = "button"
name = "Preview"
flags = ["disabled"]

[[effect.param]]
id = 2
key = "view"
type = "popup"
name = "View"
default = 8
choices = ["Source", "Uncorrected Matte Part A", "Corrected Matte Part A", "Uncorrected Matte Part B", "Corrected Matte Part B", "Uncorrected Matte", "Corrected Matte", "Final Output", "(-", "Corrected [A, B, Matte], Final"]

[[effect.param]]
id = 3
key = "key_color"
type = "color"
name = "Key Color"
default = [0, 0, 1, 1]

[[effect.param]]
id = 4
key = "color_matching_accuracy"
type = "popup"
name = "Color Matching Accuracy"
default = 1
choices = ["Faster", "More Accurate"]

[[effect.param]]
id = 5
key = "black_in_part_a"
type = "float"
name = "Black In Part A"
default = 0
range = [0, 255]

[[effect.param]]
id = 6
key = "white_in_part_a"
type = "float"
name = "White In Part A"
default = 255
range = [0, 255]

[[effect.param]]
id = 7
key = "gamma_part_a"
type = "float"
name = "Gamma Part A"
default = 1
range = [0, 10]

[[effect.param]]
id = 8
key = "black_out_part_a"
type = "float"
name = "Black Out Part A"
default = 0
range = [0, 255]

[[effect.param]]
id = 9
key = "white_out_part_a"
type = "float"
name = "White Out Part A"
default = 255
range = [0, 255]

[[effect.param]]
id = 10
key = "black_in_part_b"
type = "float"
name = "Black In Part B"
default = 0
range = [0, 255]

[[effect.param]]
id = 11
key = "white_in_part_b"
type = "float"
name = "White In Part B"
default = 255
range = [0, 255]

[[effect.param]]
id = 12
key = "gamma_part_b"
type = "float"
name = "Gamma Part B"
default = 1
range = [0, 10]

[[effect.param]]
id = 13
key = "black_out_part_b"
type = "float"
name = "Black Out Part B"
default = 0
range = [0, 255]

[[effect.param]]
id = 14
key = "white_out_part_b"
type = "float"
name = "White Out Part B"
default = 255
range = [0, 255]

[[effect.param]]
id = 15
key = "black_in_matte"
type = "float"
name = "Black In Matte"
default = 0
range = [0, 255]

[[effect.param]]
id = 16
key = "white_in_matte"
type = "float"
name = "White In Matte"
default = 255
range = [0, 255]

[[effect.param]]
id = 17
key = "gamma_matte"
type = "float"
name = "Gamma Matte"
default = 1
range = [0, 10]

