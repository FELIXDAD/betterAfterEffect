schema_version = 1

[plugin]
id = "bae.effects"
version = "0.1.0"
api = "0.1"
name = "BAE built-in effects"
description = "After Effects compatible built-in effects (workstream 07)."
authors = ["BAE"]
license = "Apache-2.0"

[[effect]]
id = "cc-color-neutralizer"
name = "CC Color Neutralizer"
category = "Color Correction"
implementation = "wgsl"
ae_match_names = ["CS Color Neutralizer"]
shader = "shaders/cc_color_neutralizer.wgsl"

[[effect.param]]
id = 1
key = "shadows_unbalance"
type = "color"
name = "Shadows Unbalance"
default = [0, 0, 0, 1]

[[effect.param]]
id = 2
key = "shadows"
type = "group"
name = "Shadows"
end_id = 6

[[effect.param]]
id = 3
key = "red_shadows"
type = "float"
name = "Red - Shadows"
group = "shadows"
default = 0
range = [-100, 100]

[[effect.param]]
id = 4
key = "green_shadows"
type = "float"
name = "Green - Shadows"
group = "shadows"
default = 0
range = [-100, 100]

[[effect.param]]
id = 5
key = "blue_shadows"
type = "float"
name = "Blue - Shadows"
group = "shadows"
default = 0
range = [-100, 100]

[[effect.param]]
id = 7
key = "midtones_unbalance"
type = "color"
name = "Midtones Unbalance"
default = [0.498039, 0.498039, 0.498039, 1]

[[effect.param]]
id = 8
key = "midtones"
type = "group"
name = "Midtones"
end_id = 12

[[effect.param]]
id = 9
key = "red_midtones"
type = "float"
name = "Red - Midtones"
group = "midtones"
default = 0
range = [-100, 100]

[[effect.param]]
id = 10
key = "green_midtones"
type = "float"
name = "Green - Midtones"
group = "midtones"
default = 0
range = [-100, 100]

[[effect.param]]
id = 11
key = "blue_midtones"
type = "float"
name = "Blue - Midtones"
group = "midtones"
default = 0
range = [-100, 100]

[[effect.param]]
id = 13
key = "highlights_unbalance"
type = "color"
name = "Highlights Unbalance"
default = [1, 1, 1, 1]

[[effect.param]]
id = 14
key = "highlights"
type = "group"
name = "Highlights"
end_id = 18

[[effect.param]]
id = 15
key = "red_highlights"
type = "float"
name = "Red - Highlights"
group = "highlights"
default = 0
range = [-100, 100]

[[effect.param]]
