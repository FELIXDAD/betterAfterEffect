schema_version = 1

[plugin]
id = "bae.effects"
version = "0.1.0"
api = "0.1"
name = "BAE built-in effects"
description = "After Effects compatible built-in effects (workstream 07)."
authors = ["BAE"]
license = "Apache-2.0"

[[effect]]
id = "gradient-wipe"
name = "Gradient Wipe"
category = "Transition"
implementation = "wgsl"
ae_match_names = ["ADBE Gradient Wipe"]
keywords = ["gradient", "wipe"]
shader = "shaders/gradient_wipe.wgsl"
identity_when = "params.transition_completion == 0"

[[effect.param]]
id = 1
key = "transition_completion"
type = "float"
name = "Transition Completion"
default = 0
range = [0, 1]

[[effect.param]]
id = 2
key = "transition_softness"
type = "float"
name = "Transition Softness"
default = 0
range = [0, 1]

[[effect.param]]
id = 3
key = "gradient_layer"
disabled = true
type = "layer"
name = "Gradient Layer"
default = "self"

[[effect.param]]
id = 4
key = "gradient_placement"
disabled = true
type = "popup"
name = "Gradient Placement"
default = 3
choices = ["Tile Gradient", "Center Gradient", "Stretch Gradient to Fit"]

[[effect.param]]
id = 5
key = "invert_gradient"
type = "checkbox"
name = "Invert Gradient"
default = false

[[effect.pass]]
entry = "gradient_wipe"
reads = ["input"]
writes = "output"
