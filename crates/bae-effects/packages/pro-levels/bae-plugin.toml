# Levels (Individual Controls) (ADBE Pro Levels2): AE-FX-039. Group start and
# end markers each consume a parameter id, as in AE (ids = AE disk ids).
schema_version = 1

[plugin]
id = "bae.effects"
version = "0.1.0"
api = "0.1"
name = "BAE built-in effects"
description = "After Effects compatible built-in effects (workstream 07)."
authors = ["BAE"]
license = "Apache-2.0"

[[effect]]
id = "pro-levels"
name = "Levels (Individual Controls)"
category = "Color Correction"
implementation = "wgsl"
ae_match_names = ["ADBE Pro Levels2"]
keywords = ["levels", "individual", "channels", "gamma"]
flags = ["pixel-independent"]
shader = "shaders/pro_levels.wgsl"
entry = "pro_levels"

[[effect.param]]
id = 1
key = "channel"
type = "popup"
name = "Channel"
default = 1
choices = ["RGB", "Red", "Green", "Blue", "Alpha"]

[[effect.param]]
id = 2
key = "histogram"
type = "arbitrary"
name = "Histogram"
flags = ["ui-only", "not-animatable", "cannot-time-vary", "no-expressions"]

[[effect.param]]
id = 3
key = "rgb"
type = "group"
name = "RGB"
end_id = 9

[[effect.param]]
id = 4
key = "rgb_input_black"
type = "float"
name = "Input Black"
default = 0.0
range = [-10000.0, 10000.0]
slider = [0.0, 1.0]
precision = 3
group = "rgb"

[[effect.param]]
id = 5
key = "rgb_input_white"
type = "float"
name = "Input White"
default = 1.0
range = [-10000.0, 10000.0]
slider = [0.0, 1.0]
precision = 3
group = "rgb"

[[effect.param]]
id = 6
key = "rgb_gamma"
type = "float"
name = "Gamma"
default = 1.0
range = [0.0, 5.0]
slider = [0.1, 5.0]
precision = 2
group = "rgb"

[[effect.param]]
id = 7
key = "rgb_output_black"
type = "float"
name = "Output Black"
default = 0.0
range = [-10000.0, 10000.0]
slider = [0.0, 1.0]
precision = 3
group = "rgb"

