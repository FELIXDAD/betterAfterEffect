schema_version = 1

[plugin]
id = "bae.effects"
version = "0.1.0"
api = "0.1"
name = "BAE built-in effects"
description = "After Effects compatible built-in effects (workstream 07)."
authors = ["BAE"]
license = "Apache-2.0"

[[effect]]
id = "cc-burn-film"
name = "CC Burn Film"
category = "Stylize"
implementation = "wgsl"
ae_match_names = ["CC Burn Film"]
shader = "shaders/cc_burn_film.wgsl"
identity_when = "params.burn == 0"

[[effect.param]]
id = 1
key = "burn"
type = "float"
name = "Burn"
default = 0
range = [0, 100]

[[effect.param]]
id = 2
key = "center"
type = "point"
name = "Center"
default = [0.5, 0.5]

[[effect.param]]
id = 3
key = "random_seed"
type = "int"
name = "Random Seed"
default = 0
range = [0, 5000]
