schema_version = 1

[plugin]
id = "bae.effects"
version = "0.1.0"
api = "0.1"
name = "BAE built-in effects"
description = "After Effects compatible built-in effects (workstream 07)."
authors = ["BAE"]
license = "Apache-2.0"

[[effect]]
id = "add-grain"
name = "Add Grain"
category = "Noise & Grain"
implementation = "wgsl"
ae_match_names = ["VISINF Grain Implant"]
keywords = ["film", "grain", "stock"]
flags = ["non-param-vary"]
shader = "shaders/add_grain.wgsl"

[effect.roi]
read = "params.blur_matte + 1"

