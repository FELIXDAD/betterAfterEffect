[package]
name = "bae-plugin"
description = "BAE plugin host: manifests, discovery, validation, declarative WGSL effects, registration and runtime load/unload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# A dedicated runner executable for out-of-process plugins in tests and tools
# (the application runs itself as `bae plugin runner`).
[[bin]]
name = "bae-plugin-runner"
path = "src/bin/runner.rs"
test = false
doc = false

[dependencies]
anyhow.workspace = true
bae-app.workspace = true
bae-gpu.workspace = true
bae-model.workspace = true
bae-platform.workspace = true
bae-plugin-sdk.workspace = true
bae-render.workspace = true
bae-script.workspace = true
clap.workspace = true
half.workspace = true
libloading.workspace = true
naga.workspace = true
parking_lot.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
memmap2.workspace = true
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
uuid.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Memory"] }

[dev-dependencies]
# Builds the C example and test plugins in tests/native.rs (already in the lockfile).
cc.workspace = true
tempfile.workspace = true
