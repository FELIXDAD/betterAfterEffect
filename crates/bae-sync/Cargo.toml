[package]
name = "bae-sync"
description = "BAE collaboration: sync protocol, shared-folder and hub transports, history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Native file-system notifications for the shared-folder transport (FSEvents,
# ReadDirectoryChangesW, inotify). Without it the folder is only polled. Off by
# default so the core stays free of platform APIs; the desktop app enables it.
watch = ["dep:notify"]

[dependencies]
bae-model.workspace = true
thiserror.workspace = true
uuid.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
notify = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
