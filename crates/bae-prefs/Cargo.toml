[package]
name = "bae-prefs"
description = "BAE preferences (AE Preferences dialog): schema, defaults, validation, storage and change notification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Read and write the preferences file with bae-platform's SettingsFile. Domain crates
# that only read preferences leave it off (no platform dependency).
file = ["dep:bae-platform"]

[dependencies]
bae-platform = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
