[package]
name = "bae-media"
description = "BAE media I/O: probing and metadata, image / image-sequence / video decoding into GPU textures, frame cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bae-app.workspace = true
bae-gpu.workspace = true
# Time (flicks) and FrameRate shared with the document model.
bae-model.workspace = true
bytemuck.workspace = true
exr.workspace = true
half.workspace = true
# WebP only (image-webp); PNG / JPEG / EXR use png / zune-jpeg / exr directly.
image = { workspace = true, features = ["webp"] }
parking_lot.workspace = true
png.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
zune-jpeg.workspace = true

# macOS video: AVFoundation demux + VideoToolbox decode into IOSurface-backed
# CVPixelBuffers, wrapped as Metal textures (zero copy). Same objc2 0.6 / 0.3
# line as wgpu-hal.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue"] }
objc2-core-foundation = { workspace = true, features = ["CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-av-foundation = { workspace = true, features = ["AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVAssetTrackSegment", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVSampleCursor", "AVTime", "AVVideoSettings", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { workspace = true, features = ["CMBase", "CMFormatDescription", "CMSampleBuffer", "CMTime", "CMTimeRange", "objc2-core-video"] }
objc2-core-video = { workspace = true, features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVMetalTexture", "CVMetalTextureCache", "CVPixelBuffer", "CVPixelBufferPool", "CVPixelFormatDescription", "CVReturn", "objc2-metal"] }
objc2-video-toolbox = { workspace = true, features = ["VTCompressionProperties"] }
objc2-metal = { workspace = true, features = ["MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "MTLTypes"] }

# Test fixtures: movies are written with AVAssetWriter (no binary files in git).
[target.'cfg(target_vendor = "apple")'.dev-dependencies]
objc2-av-foundation = { workspace = true, features = ["AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "objc2-core-media", "objc2-core-video"] }

[dev-dependencies]
# Test fixtures are generated in code: JPEG / WebP encoders (tests only).
image = { workspace = true, features = ["jpeg", "webp"] }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
