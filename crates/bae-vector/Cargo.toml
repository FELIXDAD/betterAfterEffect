[package]
name = "bae-vector"
description = "BAE vector graphics: AE shape layer contents, path geometry and operators, display lists, Vello rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# GPU drawing: Vello encoding, the shape layer source for bae-render and the shared
# Vello renderer. Off by default so geometry, operators and display lists stay usable
# from GPU-free crates (bae-storyboard, bae-interop-ai, command crates).
render = ["dep:vello", "dep:vello_cpu", "dep:bae-render", "dep:bae-gpu", "dep:parking_lot", "dep:tracing"]

[dependencies]
bae-model.workspace = true
bae-anim.workspace = true
kurbo.workspace = true
linesweeper = "0.5"
rustc-hash.workspace = true

bae-gpu = { workspace = true, optional = true }
bae-render = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
vello = { workspace = true, optional = true }
vello_cpu = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
image = { workspace = true, features = ["png"] }
# GPU tests always run with the `render` feature (`cargo test -p bae-vector`).
bae-vector = { path = ".", features = ["render"] }
bae-gpu.workspace = true
# The shapes benchmark's blur + glow scenario.
bae-effects.workspace = true
glam.workspace = true
serde_json.workspace = true

[[bench]]
name = "shapes"
harness = false

[lints]
workspace = true
