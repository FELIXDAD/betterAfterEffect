[package]
name = "bae-interop-ai"
description = "BAE <-> Adobe Illustrator interchange: .ai/PDF and bridge import, Ai content as shape layers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No GPU, window or platform dependencies: imports run headless (agents, CI,
# the hub). bae-vector without its `render` feature is geometry only. Reading
# the system clipboard belongs to the platform layer; this crate only parses
# the bytes it is given.
[dependencies]
bae-model.workspace = true
bae-vector.workspace = true
# PDF stream decompression; the same zlib-rs build bae-model's zip already links.
flate2.workspace = true
kurbo.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
bae-anim.workspace = true

[lints]
workspace = true
