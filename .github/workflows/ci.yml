# BAE continuous integration (workstream 01, ARCHITECTURE §11).
#
# Every push to main/dev and every pull request runs, on macOS arm64 and Windows x64:
# fmt (once), clippy, tests, the one-wgpu dependency check, the release size budget
# (`cargo xtask size`), a headless smoke run and packaging (`cargo xtask dist`).
# CI uses the default ./target directory (no CARGO_TARGET_DIR).

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest  # arm64; macos-14 images are retired
            target: aarch64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup --version
          # rustup >= 1.28 installs the toolchain pinned in rust-toolchain.toml, with its
          # components and targets; older rustup installs it on first use, which `rustup show` triggers.
          rustup toolchain install || rustup show
          rustup show active-toolchain
          rustc -vV
          cargo --version

      - name: Check host target
        # Builds are host-native (no --target) so clippy, test and release share one target dir.
        run: |
          host="$(rustc -vV | tr -d '\r' | sed -n 's/^host: //p')"
          echo "host: $host"
          test "$host" = "${{ matrix.target }}"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Only main/dev populate the cache; pull requests restore from their base branch.
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

      - name: Format
        if: runner.os == 'macOS'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        # GPU tests skip themselves when no adapter is available (Windows runners have WARP).
        # Windows runners have the D3D12 debug layer installed; debug builds would turn it
        # on (GpuContextDescriptor::validation), so this pass runs without it, like user
        # machines, and the next step runs with it.
        env:
          BAE_GPU_VALIDATION: ${{ runner.os == 'Windows' && '0' || '' }}
          # The AE shortcut sweep (apps/bae acceptance::shortcut_sweep) writes its
          # coverage report here; uploaded with the package.
          BAE_SHORTCUT_REPORT: ${{ github.workspace }}/shortcut-sweep.md
        run: cargo test --workspace --locked

      - name: Test with the D3D12 debug layer
        # Same test binaries (no rebuild) with D3D12 validation on, so debug-layer errors
        # still fail CI. GPU tests share one context per test process (bae_gpu::testing).
        if: runner.os == 'Windows'
        env:
          BAE_GPU_VALIDATION: "1"
        run: cargo test --workspace --locked

      - name: Test the UI crates one by one
        # `--workspace` unifies features across all crates, so a test that only passes
        # with a feature some other crate enables (e.g. egui's bundled fonts, through a
        # dev-dependency) still passes there and fails when the crate is tested alone.
        # These are the crates whose tests run egui.
        run: |
          for crate in bae-ui bae-ui-motion bae; do
            cargo test --locked -p "$crate"
          done

      - name: One wgpu in the dependency graph
        # Errors ("specification `wgpu` is ambiguous") when two wgpu versions are resolved:
        # renderer, UI and plugins must share one wgpu::Device (docs/spec/dependencies.md).
        run: cargo tree --locked -p bae-dep-probe -i wgpu --edges normal

      - name: One font stack in the app
        # egui (vendored epaint, vendor/epaint/BAE-PATCH.md), vello and parley must share one
        # skrifa / read-fonts / harfrust; a second set adds ~0.9 MiB to bae.
        run: |
          dupes="$(cargo tree --locked -p bae -d -e normal --depth 0 | grep -E '^(skrifa|read-fonts|harfrust) ' || true)"
          if [ -n "$dupes" ]; then
            echo "bae links more than one version of:"
            echo "$dupes"
            exit 1
          fi

      - name: Release size budget
        # Release build of bae + check against tools/size-budget/budget.toml; fails when over.
        run: cargo xtask size --json size-report.json

      - name: Headless smoke run
        # Allowed to fail: hosted runners have no reliable GPU (paravirtualized Metal, WARP).
        # The binary path comes from the size report, so it follows the real target dir.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          bin="$(jq -r .binary size-report.json)"
          if command -v cygpath >/dev/null 2>&1; then bin="$(cygpath -u "$bin")"; fi
          "$bin" --headless --smoke-test 30

      - name: Package
        run: cargo xtask dist --no-build

      - name: macOS bundle signature
        # Checks the zip as a user gets it: unpacked like Archive Utility does, with the
        # quarantine flag a browser download sets. A broken signature makes Gatekeeper call
        # the app "damaged" with no way to open it (#105). BAE.app is ad-hoc signed and not
        # notarized, so spctl rejecting it is expected; any other spctl verdict is a
        # signature error and fails the job.
        if: runner.os == 'macOS'
        run: |
          check="$RUNNER_TEMP/bundle-check"
          rm -rf "$check" && mkdir -p "$check"
          zips=(target/dist/BAE-*-macos.zip)
          ditto -x -k "${zips[0]}" "$check"
          app="$check/BAE.app"
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");CI;" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app"
          verdict="$(spctl --assess --type exec -vv "$app" 2>&1 || true)"
          echo "spctl: $verdict"
          syspolicy_check distribution "$app" || true
          if ! grep -Eq ': (rejected|accepted)$' <<<"$verdict"; then
            echo "::error::BAE.app has a code signature error: $verdict"
            exit 1
          fi

      - name: Upload package and size report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bae-${{ matrix.target }}
          path: |
            target/dist/*.zip
            size-report.json
            shortcut-sweep.md
          # Earlier failures already fail the job; still upload whatever exists.
          if-no-files-found: warn
          retention-days: 14
