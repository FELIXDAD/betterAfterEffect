# Crash hunt on Windows runners (issue #154): runs GPU test binaries many times, saves
# full dumps of crashes, prints symbolized stacks with cdb and uploads dumps + exe + pdb.
# Manual only: it does not run with normal CI. Added for #154 by the app workstream
# (`.github` belongs to 01).
#
#   gh workflow run win-crash-repro.yml --ref <branch> -f set=bae-render:render -f wrap=wer
#
# Pushes to the `ci/win-crash-repro` branch also run it, with the plan in the `plan` job
# below, so it can be used before the file is on the default branch (GitHub only lists
# dispatchable workflows from there).
#
# Wrappers:
# - wer: the test runs with no debugger attached (CI does the same); Windows Error
#   Reporting LocalDumps writes the dump. Debuggers change timing and exception handling.
# - procdump: Sysinternals procdump -e -ma -x launches the test as a debugger.
# Page heap (full) puts every heap allocation against a guard page, so a heap overrun or
# use-after-free faults at the bad access instead of corrupting memory silently.

name: Windows crash repro

on:
  workflow_dispatch:
    inputs:
      set:
        description: "Test binaries run per iteration, 'package:test' comma-separated, or 'gpu-all'"
        default: bae-render:render
        type: string
      threads:
        description: "Test threads: default (harness default) or a number"
        default: default
        type: string
      wrap:
        description: Crash dump capture
        default: wer
        type: choice
        options: [wer, procdump]
      pageheap:
        description: Full page heap for the test binaries
        default: false
        type: boolean
      fresh_cache:
        description: Delete the D3D shader cache (%LOCALAPPDATA%\D3DSCache) before every run
        default: false
        type: boolean
      debug_layer:
        description: "D3D12 debug layer (d3d12SDKLayers.dll, installed on the runners): on, or off (the DLL is renamed)"
        default: "on"
        type: choice
        options: ["on", "off"]
      env:
        description: "Extra environment for the tests, 'NAME=value;NAME=value'; WGPU_DX12_COMPILER=dxc uses the Windows SDK's DXC"
        default: ""
        type: string
      iterations:
        description: Iterations per job
        default: "300"
        type: string
      jobs:
        description: Identical jobs (runners) to spread the iterations over
        default: "1"
        type: string
  push:
    branches: [ci/win-crash-repro]

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Full dumps kept per job (each can be hundreds of MB); later crashes get minidumps.
  MAX_FULL_DUMPS: 3
  MAX_MINI_DUMPS: 12
  # A run longer than this is a hang: dumped and killed.
  RUN_TIMEOUT_SECONDS: 300
  # Iterations stop after this long so the dumps still get analyzed and uploaded.
  RUN_BUDGET_MINUTES: 120

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_SET: ${{ inputs.set }}
          IN_THREADS: ${{ inputs.threads }}
          IN_WRAP: ${{ inputs.wrap }}
          IN_PAGEHEAP: ${{ inputs.pageheap }}
          IN_FRESH: ${{ inputs.fresh_cache }}
          IN_ENV: ${{ inputs.env }}
          IN_DEBUG_LAYER: ${{ inputs.debug_layer }}
          IN_N: ${{ inputs.iterations }}
          IN_JOBS: ${{ inputs.jobs }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            matrix="$(jq -cn --arg set "$IN_SET" --arg threads "$IN_THREADS" --arg wrap "$IN_WRAP" \
              --arg pageheap "$IN_PAGEHEAP" --arg fresh "$IN_FRESH" --arg env "$IN_ENV" --arg dl "$IN_DEBUG_LAYER" \
              --arg n "$IN_N" --argjson jobs "${IN_JOBS:-1}" '
              {include: [range(1; $jobs + 1) as $j | {
                id: "dispatch-\($j)", set: $set, threads: $threads, wrap: $wrap,
                pageheap: $pageheap, fresh: $fresh, env: $env, debuglayer: $dl, n: $n }]}')"
          else
            # The plan for pushes to ci/win-crash-repro: #194, FXC blobs shared across
            # threads by wgpu-hal's shader cache. The same stress test (4 threads build
            # pipelines from one shader) with crates.io wgpu-hal ("unpatch") and with
            # vendor/wgpu-hal.
            matrix='{"include":[
              {"id":"fxc-unpatched-1","set":"bae-gpu:concurrent_pipelines","threads":"default","wrap":"wer","pageheap":"false","fresh":"false","env":"BAE_STRESS_ITERATIONS=3000","debuglayer":"on","unpatch":"true","n":"150"},
              {"id":"fxc-unpatched-2","set":"bae-gpu:concurrent_pipelines","threads":"default","wrap":"wer","pageheap":"false","fresh":"false","env":"BAE_STRESS_ITERATIONS=3000","debuglayer":"on","unpatch":"true","n":"150"},
              {"id":"fxc-unpatched-3","set":"bae-gpu:concurrent_pipelines","threads":"default","wrap":"wer","pageheap":"false","fresh":"false","env":"BAE_STRESS_ITERATIONS=3000","debuglayer":"on","unpatch":"true","n":"150"},
              {"id":"fxc-patched-1","set":"bae-gpu:concurrent_pipelines","threads":"default","wrap":"wer","pageheap":"false","fresh":"false","env":"BAE_STRESS_ITERATIONS=3000","debuglayer":"on","unpatch":"false","n":"150"},
              {"id":"fxc-patched-2","set":"bae-gpu:concurrent_pipelines","threads":"default","wrap":"wer","pageheap":"false","fresh":"false","env":"BAE_STRESS_ITERATIONS=3000","debuglayer":"on","unpatch":"false","n":"150"},
              {"id":"fxc-patched-3","set":"bae-gpu:concurrent_pipelines","threads":"default","wrap":"wer","pageheap":"false","fresh":"false","env":"BAE_STRESS_ITERATIONS=3000","debuglayer":"on","unpatch":"false","n":"150"}
            ]}'
            matrix="$(echo "$matrix" | jq -c .)"
          fi
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  repro:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '{"include":[]}' }}
    name: ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SET: ${{ matrix.set }}
      THREADS: ${{ matrix.threads }}
      WRAP: ${{ matrix.wrap }}
      PAGEHEAP: ${{ matrix.pageheap }}
      FRESH_CACHE: ${{ matrix.fresh }}
      EXTRA_ENV: ${{ matrix.env }}
      DEBUG_LAYER: ${{ matrix.debuglayer || 'on' }}
      UNPATCH: ${{ matrix.unpatch || 'false' }}
      ITERATIONS: ${{ matrix.n }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install || rustup show
          rustc -vV

      - uses: Swatinem/rust-cache@v2
        with:
          key: win-crash-repro

      - name: Machine
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\repro"
          function Version($path) {
            if (-not (Test-Path $path)) { return "missing" }
            $v = (Get-Item $path).VersionInfo
            "{0}.{1}.{2}.{3}" -f $v.FileMajorPart, $v.FileMinorPart, $v.FileBuildPart, $v.FilePrivatePart
          }
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $gpus = (Get-CimInstance Win32_VideoController | ForEach-Object { "$($_.Name) ($($_.DriverVersion))" }) -join "; "
          $dxcOnPath = (& where.exe dxcompiler.dll 2>$null) -join "; "
          $global:LASTEXITCODE = 0
          if (-not $dxcOnPath) { $dxcOnPath = "none" }
          $sdkDxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter dxcompiler.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName | Select-Object -Last 1
          if ($sdkDxc) { "SDK_DXC_DIR=$($sdkDxc.DirectoryName)" >> $env:GITHUB_ENV }
          $sys = "$env:WINDIR\System32"
          $lines = @(
            "Job: ${{ matrix.id }}",
            "OS: $($os.Caption) $($os.Version) build $($os.BuildNumber); image $env:ImageOS $env:ImageVersion",
            "CPU: $($cpu.Name.Trim()) ($($cpu.NumberOfCores) cores, $($cpu.NumberOfLogicalProcessors) threads); RAM $([math]::Round($os.TotalVisibleMemorySize / 1MB, 1)) GiB",
            "Display adapters: $gpus",
            "d3d10warp.dll: $(Version "$sys\d3d10warp.dll")",
            "d3d12.dll: $(Version "$sys\d3d12.dll")",
            "D3D12Core.dll: $(Version "$sys\D3D12Core.dll")",
            "d3d12SDKLayers.dll (debug layer): $(Version "$sys\d3d12SDKLayers.dll")",
            "dxgi.dll: $(Version "$sys\dxgi.dll")",
            "dxgidebug.dll: $(Version "$sys\dxgidebug.dll")",
            "d3dcompiler_47.dll (FXC): $(Version "$sys\d3dcompiler_47.dll")",
            "dxcompiler.dll in System32: $(Version "$sys\dxcompiler.dll"); on PATH: $dxcOnPath; Windows SDK: $(if ($sdkDxc) { "$($sdkDxc.FullName) $(Version $sdkDxc.FullName)" } else { 'none' })",
            "DWrite.dll: $(Version "$sys\DWrite.dll")",
            "Set: $env:SET; threads: $env:THREADS; wrap: $env:WRAP; page heap: $env:PAGEHEAP; fresh shader cache: $env:FRESH_CACHE; D3D12 debug layer: $env:DEBUG_LAYER; env: '$env:EXTRA_ENV'; iterations: $env:ITERATIONS"
          )
          $lines | Tee-Object -FilePath "$out\machine.txt"
          "## ${{ matrix.id }}" >> $env:GITHUB_STEP_SUMMARY
          $lines | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY

      - name: Build the tests (Debug, line tables for every crate)
        shell: bash
        run: |
          if [ "$SET" = gpu-all ]; then
            # Every integration test that creates a GPU context, in `cargo test --workspace` order.
            SET="bae-color:gpu,bae-effects:ae_golden,bae-effects:registry,bae-gpu:headless,bae-media:gpu,bae-plugin:declarative_gpu,bae-plugin:host,bae-render:ae_golden,bae-render:render,bae-text:cpu,bae-text:gpu,bae-vector:cpu,bae-vector:evaluated,bae-vector:gpu"
          fi
          # The whole workspace, like CI's `cargo test --workspace`, so features unify the
          # same way and the binaries are the ones CI runs. Same opt-levels as CI (deps at
          # 2), plus line tables for dependencies so their frames have names and lines.
          locked=--locked
          if [ "$UNPATCH" = true ]; then
            # crates.io wgpu-hal instead of vendor/wgpu-hal (the lockfile follows).
            sed -i '/^wgpu-hal = { path = "vendor\/wgpu-hal" }$/d' Cargo.toml
            if grep -q '^wgpu-hal = { path' Cargo.toml; then echo "patch line still there"; exit 1; fi
            locked=
            echo "UNPATCHED: crates.io wgpu-hal" >> "$RUNNER_TEMP/repro/machine.txt"
          fi
          cargo test --workspace --no-run $locked --message-format=json \
            --config 'profile.dev.package."*".debug="line-tables-only"' > "$RUNNER_TEMP/build.json"
          bin="$(cygpath -u "$RUNNER_TEMP")/repro/bin"
          mkdir -p "$bin"
          : > "$RUNNER_TEMP/tests.txt"
          IFS=, read -ra specs <<< "$SET"
          for spec in "${specs[@]}"; do
            pkg="${spec%%:*}"; test="${spec#*:}"
            exe="$(jq -r --arg p "$pkg" --arg t "$test" 'select(.reason == "compiler-artifact" and .target.name == $t and .executable != null and (.manifest_path | gsub("\\\\"; "/") | endswith("/" + $p + "/Cargo.toml"))) | .executable' "$RUNNER_TEMP/build.json" | tail -1)"
            if [ -z "$exe" ]; then echo "no test binary for $spec"; exit 1; fi
            exe_u="$(cygpath -u "$exe")"
            test -f "$exe_u"
            cp "$exe_u" "$bin/"
            stem="$(basename "$exe_u" .exe)"
            # PDBs stay next to the exe too (the dump records that path).
            find "$(dirname "$exe_u")" -maxdepth 1 -iname "*.pdb" \( -iname "${stem}*" -o -iname "${stem//-/_}*" \) -exec cp {} "$bin/" \;
            printf '%s\t%s\n' "$pkg" "$exe" >> "$RUNNER_TEMP/tests.txt"
          done
          cat "$RUNNER_TEMP/tests.txt"
          ls -la "$bin"

      - name: Install procdump (hang dumps; wrap=procdump)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\procdump"
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" -DestinationPath $dir -Force
          "PROCDUMP=$dir\procdump64.exe" >> $env:GITHUB_ENV

      - name: Set up crash capture
        shell: pwsh
        run: |
          # Non-zero exits of the tests are data, not step errors.
          $PSNativeCommandUseErrorActionPreference = $false
          $out = "$env:RUNNER_TEMP\repro"
          $full = New-Item -ItemType Directory -Force "$out\dumps"
          $mini = New-Item -ItemType Directory -Force "$out\minidumps"
          # Windows Error Reporting LocalDumps: full dumps of any crashing process.
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
          New-Item $wer -Force | Out-Null
          Set-ItemProperty $wer -Name Disabled -Value 0 -Type DWord
          Set-ItemProperty $wer -Name DontShowUI -Value 1 -Type DWord
          New-Item "$wer\LocalDumps" -Force | Out-Null
          Set-ItemProperty "$wer\LocalDumps" -Name DumpFolder -Value $full.FullName -Type ExpandString
          Set-ItemProperty "$wer\LocalDumps" -Name DumpType -Value 2 -Type DWord
          Set-ItemProperty "$wer\LocalDumps" -Name DumpCount -Value 50 -Type DWord
          Set-Service WerSvc -StartupType Manual -ErrorAction SilentlyContinue
          Start-Service WerSvc -ErrorAction SilentlyContinue
          Get-Service WerSvc | Format-Table -AutoSize | Out-String | Write-Output
          # Self-test: a process that writes to an unmapped address must leave a dump.
          $src = "$env:RUNNER_TEMP\crasher.rs"
          'fn main() { unsafe { std::ptr::write_volatile(0x10 as *mut u32, 1) } }' | Set-Content $src
          rustc -O -o "$env:RUNNER_TEMP\crasher.exe" $src
          Add-Type -Namespace Native -Name Kernel32 -MemberDefinition '[DllImport("kernel32.dll")] public static extern uint SetErrorMode(uint mode);'
          $previous = [Native.Kernel32]::SetErrorMode(0)
          Write-Output ("error mode inherited by this shell: 0x{0:X}" -f $previous)
          & "$env:RUNNER_TEMP\crasher.exe"
          Write-Output ("crasher exit code: 0x{0:X8}" -f $LASTEXITCODE)
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Get-ChildItem $full -Filter 'crasher*.dmp') -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          $dump = Get-ChildItem $full -Filter 'crasher*.dmp' | Select-Object -First 1
          if ($dump) {
            Write-Output "WER self-test: ok ($($dump.Name), $([math]::Round($dump.Length / 1KB)) KiB)"
            Remove-Item $dump.FullName
          } else {
            Write-Output "::warning::WER self-test: no dump; crashes under wrap=wer will be counted but not dumped"
          }
          if ($env:PAGEHEAP -eq 'true') {
            Get-Content "$env:RUNNER_TEMP\tests.txt" | ForEach-Object {
              $exe = Split-Path ($_ -split "`t")[1] -Leaf
              $ifeo = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\$exe"
              New-Item $ifeo -Force | Out-Null
              # FLG_HEAP_PAGE_ALLOCS; PageHeapFlags 3 = full page heap + stack traces.
              Set-ItemProperty $ifeo -Name GlobalFlag -Value 0x02000000 -Type DWord
              Set-ItemProperty $ifeo -Name PageHeapFlags -Value 3 -Type DWord
              Write-Output "full page heap: $exe"
            }
          }
          if ($env:DEBUG_LAYER -eq 'off') {
            # Debug builds ask for the D3D12 debug layer (GpuContextDescriptor::validation);
            # without the DLL wgpu logs a warning and runs without it, like most user machines.
            foreach ($dir in "$env:WINDIR\System32", "$env:WINDIR\SysWOW64") {
              $dll = "$dir\d3d12SDKLayers.dll"
              if (Test-Path $dll) {
                & takeown.exe /f $dll | Out-Null
                & icacls.exe $dll /grant "*S-1-5-32-544:F" | Out-Null
                Rename-Item $dll "d3d12SDKLayers.dll.off"
                Write-Output "renamed $dll"
              }
            }
            if (Test-Path "$env:WINDIR\System32\d3d12SDKLayers.dll") { throw "d3d12SDKLayers.dll is still there" }
          }
          # GitHub fails a pwsh step whose last native command exited non-zero (the crasher).
          $global:LASTEXITCODE = 0

      - name: Run ${{ matrix.n }} iterations
        id: runs
        shell: pwsh
        run: |
          # Non-zero exits of the tests are data, not step errors.
          $PSNativeCommandUseErrorActionPreference = $false
          $out = "$env:RUNNER_TEMP\repro"
          $full = "$out\dumps"
          $mini = "$out\minidumps"
          $logs = New-Item -ItemType Directory -Force "$out\logs"
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          Add-Type -Namespace Native -Name Kernel32 -MemberDefinition '[DllImport("kernel32.dll")] public static extern uint SetErrorMode(uint mode);'
          # Children inherit the error mode; SEM_NOGPFAULTERRORBOX would skip WER entirely.
          [void][Native.Kernel32]::SetErrorMode(0)
          foreach ($pair in ($env:EXTRA_ENV -split ';' | Where-Object { $_ -match '=' })) {
            $name, $value = $pair -split '=', 2
            Set-Item "env:$($name.Trim())" $value
            Write-Output "env: $($name.Trim())=$value"
          }
          if ($env:WGPU_DX12_COMPILER -match 'dxc' -and $env:WGPU_DX12_COMPILER -notmatch 'static') {
            if (-not $env:SDK_DXC_DIR) { throw "WGPU_DX12_COMPILER=dxc but the Windows SDK has no dxcompiler.dll" }
            # wgpu loads dxcompiler.dll by name; the SDK directory also has dxil.dll.
            $env:PATH = "$env:SDK_DXC_DIR;$env:PATH"
            Write-Output "DXC from $env:SDK_DXC_DIR"
          }
          $packages = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages
          $tests = Get-Content "$env:RUNNER_TEMP\tests.txt" | ForEach-Object {
            $pkg, $exe = $_ -split "`t"
            $dir = Split-Path ($packages | Where-Object name -eq $pkg | Select-Object -First 1 -ExpandProperty manifest_path)
            [pscustomobject]@{ Package = $pkg; Exe = $exe; Name = [IO.Path]::GetFileNameWithoutExtension($exe); Dir = $dir }
          }
          $testArgs = @()
          if ($env:THREADS -ne 'default') { $testArgs += "--test-threads=$env:THREADS" }
          $n = [int]$env:ITERATIONS
          $timeoutMs = [int]$env:RUN_TIMEOUT_SECONDS * 1000
          $crashes = [System.Collections.Generic.List[string]]::new()
          $failures = [System.Collections.Generic.List[string]]::new()
          $hangs = [System.Collections.Generic.List[string]]::new()
          $codes = @{}
          $runs = 0
          $miniMode = $false
          $started = Get-Date
          $done = 0
          for ($i = 1; $i -le $n; $i++) {
            if (((Get-Date) - $started).TotalMinutes -gt [int]$env:RUN_BUDGET_MINUTES) {
              Write-Output "::notice::stopping after $done iterations: $env:RUN_BUDGET_MINUTES min budget used"
              break
            }
            $done = $i
            foreach ($t in $tests) {
              $runs++
              $tag = "{0:D4}-{1}" -f $i, $t.Name
              $log = "$logs\$tag.log"
              if ($env:FRESH_CACHE -eq 'true') {
                Remove-Item "$env:LOCALAPPDATA\D3DSCache" -Recurse -Force -ErrorAction SilentlyContinue
              }
              $env:CARGO_MANIFEST_DIR = $t.Dir
              $before = @(Get-ChildItem $full, $mini -Filter *.dmp).Count
              $start = Get-Date
              if ($env:WRAP -eq 'procdump') {
                $file = $env:PROCDUMP
                $argList = @('-accepteula', '-e', '-ma', '-x', $(if ($miniMode) { $mini } else { $full }), $t.Exe) + $testArgs
              } else {
                $file = $t.Exe
                $argList = $testArgs
              }
              $psi = [System.Diagnostics.ProcessStartInfo]::new($file)
              foreach ($a in $argList) { $psi.ArgumentList.Add($a) }
              $psi.WorkingDirectory = $t.Dir
              $psi.UseShellExecute = $false
              $psi.RedirectStandardOutput = $true
              $psi.RedirectStandardError = $true
              $p = [System.Diagnostics.Process]::Start($psi)
              $stdout = $p.StandardOutput.ReadToEndAsync()
              $stderr = $p.StandardError.ReadToEndAsync()
              $hung = -not $p.WaitForExit($timeoutMs)
              if ($hung) {
                $hangs.Add($tag)
                Write-Output "::warning::$tag hung for $env:RUN_TIMEOUT_SECONDS s; dumping and killing"
                & $env:PROCDUMP -accepteula -ma $p.Id $full *> "$logs\$tag-hang-procdump.log"
                Get-CimInstance Win32_Process -Filter "ParentProcessId = $($p.Id)" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
                $p.Kill($true)
                $p.WaitForExit()
              }
              $p.WaitForExit()
              $code = $p.ExitCode
              $text = $stdout.Result + "`n----- stderr -----`n" + $stderr.Result
              Set-Content -Path $log -Value $text
              $secs = [math]::Round(((Get-Date) - $start).TotalSeconds, 2)
              # Rust tests exit 0 (pass) or 101 (a test failed); anything else is a crash.
              $dumped = @(Get-ChildItem $full, $mini -Filter *.dmp).Count -gt $before
              if ($hung) {
                $crashed = $false
                Get-ChildItem $full -Filter *.dmp | Where-Object { -not $_.Name.StartsWith('run') } |
                  ForEach-Object { Rename-Item $_.FullName "hang$tag-$($_.Name)" }
              } elseif ($env:WRAP -eq 'procdump') {
                # procdump -e writes a dump only for an unhandled exception.
                $crashed = $dumped
              } else {
                $crashed = $dumped -or (($code -ne 0) -and ($code -ne 101))
              }
              if ($hung) {
                Write-Output ($text -split "`n" | Select-Object -Last 40)
              } elseif ($crashed) {
                $hex = "0x{0:X8}" -f $code
                $crashes.Add("$tag ($hex)")
                $codes[$hex] = 1 + [int]$codes[$hex]
                Write-Output "::warning::$tag crashed: exit $hex after $secs s, dump: $dumped"
                Write-Output ($text -split "`n" | Select-Object -Last 60)
                if ($dumped) {
                  # Let WER finish writing, then name the dump after the run.
                  $deadline = (Get-Date).AddSeconds(90)
                  do {
                    $sizes = (Get-ChildItem $full, $mini -Filter *.dmp | Measure-Object Length -Sum).Sum
                    Start-Sleep -Seconds 2
                  } while ($sizes -ne (Get-ChildItem $full, $mini -Filter *.dmp | Measure-Object Length -Sum).Sum -and (Get-Date) -lt $deadline)
                  Get-ChildItem $full, $mini -Filter *.dmp | Where-Object { -not ($_.Name.StartsWith('run') -or $_.Name.StartsWith('hang')) } |
                    ForEach-Object { Rename-Item $_.FullName "run$tag-$($_.Name)" }
                }
                if (-not $miniMode -and @(Get-ChildItem $full -Filter *.dmp).Count -ge [int]$env:MAX_FULL_DUMPS) {
                  # Later crashes: minidumps (stacks, no heap) to keep the artifact small.
                  $miniMode = $true
                  Set-ItemProperty $wer -Name DumpFolder -Value $mini -Type ExpandString
                  Set-ItemProperty $wer -Name DumpType -Value 1 -Type DWord
                }
                if (@(Get-ChildItem $mini -Filter *.dmp).Count -ge [int]$env:MAX_MINI_DUMPS) {
                  Set-ItemProperty $wer -Name DumpType -Value 0 -Type DWord
                  Set-ItemProperty $wer -Name CustomDumpFlags -Value 0 -Type DWord
                }
              } elseif ($code -eq 101 -or $text -notmatch 'test result: ok') {
                $failures.Add("$tag (exit $code)")
                Write-Output "::warning::$tag failed: exit $code after $secs s"
                Write-Output ($text -split "`n" | Select-Object -Last 40)
              } else {
                Remove-Item $log
                if ($i -eq 1) { Write-Output "$tag ok ($secs s)"; Write-Output $text }
              }
            }
            if ($i % 50 -eq 0) {
              $mins = [math]::Round(((Get-Date) - $started).TotalMinutes, 1)
              Write-Output "iteration ${i}: $($crashes.Count) crash(es), $($failures.Count) failure(s), $($hangs.Count) hang(s) after $mins min"
            }
            if ($i -eq 1 -and (Test-Path "$env:LOCALAPPDATA\D3DSCache")) {
              $files = Get-ChildItem "$env:LOCALAPPDATA\D3DSCache" -Recurse -File
              Write-Output "D3DSCache after the first iteration: $($files.Count) files, $([math]::Round(($files | Measure-Object Length -Sum).Sum / 1KB)) KiB"
            }
          }
          $summary = "${{ matrix.id }}: $($crashes.Count) crash(es), $($failures.Count) other failure(s), $($hangs.Count) hang(s) in $runs test-binary runs ($done of $n iterations)"
          if ($codes.Count) { $summary += "; exit codes: " + (($codes.GetEnumerator() | ForEach-Object { "$($_.Key) x$($_.Value)" }) -join ', ') }
          if ($crashes.Count) { $summary += "; crashed: $($crashes -join ', ')" }
          if ($failures.Count) { $summary += "; failed: $($failures -join ', ')" }
          if ($hangs.Count) { $summary += "; hung: $($hangs -join ', ')" }
          Write-Output $summary
          $summary | Out-File -Append "$out\machine.txt"
          "- **Result:** $summary" >> $env:GITHUB_STEP_SUMMARY
          "crashes=$($crashes.Count)" >> $env:GITHUB_OUTPUT
          "failures=$($failures.Count + $hangs.Count)" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - name: Analyze dumps (cdb)
        if: ${{ !cancelled() && (steps.runs.outputs.crashes != '0' || steps.runs.outputs.failures != '0') }}
        shell: pwsh
        run: |
          # Non-zero exits of the tests are data, not step errors.
          $PSNativeCommandUseErrorActionPreference = $false
          $out = "$env:RUNNER_TEMP\repro"
          $dumps = Get-ChildItem "$out\dumps", "$out\minidumps" -Filter *.dmp | Sort-Object Name | Select-Object -First 8
          if (-not $dumps) { Write-Output "no dumps"; exit 0 }
          $cdb = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe",
            "$env:ProgramFiles\Windows Kits\10\Debuggers\x64\cdb.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cdb) {
            $cdb = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits", "$env:ProgramFiles\Windows Kits" -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $cdb) {
            Write-Output "::warning::cdb.exe not found; dumps are uploaded unanalyzed"
            exit 0
          }
          Write-Output "cdb: $cdb"
          $bin = "$out\bin"
          $sym = "cache*$env:RUNNER_TEMP\symcache;$bin;srv*https://msdl.microsoft.com/download/symbols"
          # Commands that can fail (disassembly at a bad rip) come last: cdb drops the
          # rest of the command line after an error.
          $commands = '.lines -e; .echo ===== ANALYZE =====; !analyze -v; .echo ===== ALL THREADS =====; ~*kb 50; .echo ===== EXCEPTION CONTEXT =====; .ecxr; r; kb 80; .echo ===== MODULES =====; lmv m d3d10warp; lmv m D3D12Core; lmv m d3d12SDKLayers; lmv m d3dcompiler_47; lmv m dxcompiler; lmv m DWrite; .echo ===== CODE =====; ub @rip L12; u @rip L4; q'
          foreach ($d in $dumps) {
            $report = "$out\$($d.BaseName)-analysis.txt"
            Write-Output "===== $($d.Name) ($([math]::Round($d.Length / 1MB)) MiB) ====="
            & $cdb -z $d.FullName -y $sym -i $bin -srcpath $env:GITHUB_WORKSPACE -c $commands *> $report
            Get-Content $report
          }
          $global:LASTEXITCODE = 0

      - name: Upload dumps, binaries and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: win-crash-repro-${{ matrix.id }}
          path: ${{ runner.temp }}/repro
          if-no-files-found: warn
          retention-days: 14

      - name: Verdict
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if ('${{ steps.runs.outputs.crashes }}' -ne '0' -or '${{ steps.runs.outputs.failures }}' -ne '0') {
            Write-Output "::error::crashes: ${{ steps.runs.outputs.crashes }}, other failures and hangs: ${{ steps.runs.outputs.failures }} (see the step summary and the artifact)"
            exit 1
          }

  inspect:
    # One-off analysis of a dump uploaded by an earlier run (#154): run
    # 44957484008, job fixed-renderlib-4 (heap corruption freeing an FXC blob).
    if: ${{ github.event_name == 'push' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: win-crash-repro-fixed-renderlib-4
          run-id: 44957484008
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dump
      - name: cdb
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $cdb = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe",
            "$env:ProgramFiles\Windows Kits\10\Debuggers\x64\cdb.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          $root = "$env:RUNNER_TEMP\dump"
          Get-ChildItem $root -Recurse -Filter *.dmp | ForEach-Object { "$($_.FullName) $([math]::Round($_.Length / 1MB)) MiB" }
          $bin = "$root\bin"
          $sym = "cache*$env:RUNNER_TEMP\symcache;$bin;srv*https://msdl.microsoft.com/download/symbols"
          $commands = '.lines -e; .echo ===== ALL THREADS =====; ~*kb 60; .echo ===== EXCEPTION =====; .exr -1; .ecxr; kb 80; .echo ===== HEAP =====; !analyze -v; .echo ===== FXC BLOB REFCOUNT =====; x d3dcompiler_47!D3DX11Core::CBuffer::*; uf d3dcompiler_47!D3DX11Core::CBuffer::AddRef; uf d3dcompiler_47!D3DX11Core::CBuffer::Release; q'
          Get-ChildItem $root -Recurse -Filter *.dmp | ForEach-Object {
            & $cdb -z $_.FullName -y $sym -i $bin -c $commands
          }
          # The same functions straight from the runner's DLL (image opened as a dump).
          & $cdb -z "$env:WINDIR\System32\d3dcompiler_47.dll" -y "cache*$env:RUNNER_TEMP\symcache;srv*https://msdl.microsoft.com/download/symbols" -c '.reload /f; uf d3dcompiler_47!D3DX11Core::CBuffer::AddRef; uf d3dcompiler_47!D3DX11Core::CBuffer::Release; uf d3dcompiler_47!D3DX11Core::CBuffer::QueryInterface; q'
          $global:LASTEXITCODE = 0
