[package]
name = "bae-hub"
description = "BAE collaboration hub: real-time sync over WebSocket, project logs, team tokens (runs on a NAS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "bae-hub"
path = "src/main.rs"

[dependencies]
# `hub`: HubTransport, the WebSocket transport the clients use as well.
bae-sync = { workspace = true, features = ["hub"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
uuid.workspace = true
blake3.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
bae-model.workspace = true
tempfile.workspace = true
