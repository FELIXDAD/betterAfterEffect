# Manifest of the Rust example effect (docs/spec/plugin-architecture.md §5.3).
# No [[effect.param]] listing: the host takes the parameters from define_params
# (generated by bae_plugin_sdk from `Duotone::PARAMS`).
schema_version = 1

[plugin]
id = "com.example.duotone-rs"
version = "0.1.0"                          # = export_plugin! version in src/lib.rs
api = "1.0"                                # the API of bae-plugin-sdk (ABI 1.0)
name = "Duotone (Rust example)"
description = "Maps the luminance of a layer to a gradient between two colors. Native CPU effect written in Rust with bae-plugin-sdk."
authors = ["BAE contributors"]
license = "Apache-2.0"

[native]
isolation = "out-of-process"               # crash isolation (spec §15)

[native.libraries]
macos-aarch64 = "bin/macos-aarch64/libduotone_rs.dylib"
windows-x86_64 = "bin/windows-x86_64/duotone_rs.dll"
linux-x86_64 = "bin/linux-x86_64/libduotone_rs.so"

[[effect]]
id = "duotone"                             # = Duotone::ID in src/lib.rs
name = "Duotone"
category = "Color Correction"
class = "filter"
implementation = "native"
keywords = ["duotone", "gradient", "tint"]
flags = ["pixel-independent"]
devices = ["cpu"]
