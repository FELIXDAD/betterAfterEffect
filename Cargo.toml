[workspace]
resolver = "3"
# Add "apps/*" and "services/*" once those directories exist (cargo rejects empty globs).
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "accesskit", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
